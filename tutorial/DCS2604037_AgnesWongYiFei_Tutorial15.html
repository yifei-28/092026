
<!DOCTYPE html>
<html>
<head>
<title>Online Shopping Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="shopping.css">
</head>

<body>

<div class="form-container">

<h1>Buy a T-Shirt!</h1>
<p>Please fill in the form below to place your order.</p>

<form>

<h3>Product Details</h3>

<label>Which one do you want? *</label>
<br>
<select name="product" required>
<option value="">- Select T-Shirt -</option>
<option value="Plain">Plain T-Shirt</option>
<option value="Graphic">Graphic T-Shirt</option>
<option value="Oversized">Oversized T-Shirt</option>
<option value="Polo">Polo T-Shirt</option>
</select>

<div class="row">
<div class="column">
<label>Size *</label>
<select name="size" required>
<option value="">- Select Size -</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
</select>
</div>

<div class="column">
<label>Color *</label>
<select name="color" required>
<option value="">- Select Color -</option>
<option value="White">White</option>
<option value="Black">Black</option>
<option value="Red">Red</option>
<option value="Blue">Blue</option>
</select>
</div>
</div>

<label>Quantity *</label>
<br>
<input type="number" name="quantity" min="1" value="1" required>

<h3>Personal Details</h3>

<div class="row">
<div class="column">
<label>First Name *</label>
<input type="text" name="fname" required>
</div>

<div class="column">
<label>Last Name *</label>
<input type="text" name="lname" required>
</div>
</div>

<label>Email *</label>
<br>
<input type="email" name="email" required>

<br><br>
<label>Phone Number *</label>
<br>
<input type="tel" name="phone" required>

<br><br>
<label>Delivery Address *</label>
<br>
<textarea name="address" rows="4" required></textarea>

<h3>Delivery Method</h3>

<input type="radio" name="delivery" value="Delivery" required>
Home Delivery

<input type="radio" name="delivery" value="Pickup">
Self Pickup

<h3>Payment Method</h3>

<input type="radio" name="payment" value="Online Banking" required>
Online Banking

<input type="radio" name="payment" value="Cash">
Cash

<input type="radio" name="payment" value="E-Wallet">
E-Wallet

<h3>Additional Information</h3>

<label>Special Requests:</label>
<br>
<textarea name="remarks" rows="3"></textarea>

<br><br>
<input type="checkbox" name="agreement" required>
I confirm that the information provided is correct.

<br><br>

<div class="buttons">
<input type="submit" value="Submit Order">
<input type="reset" value="Reset">
</div>

</form>
</div>

</body>
</html>
