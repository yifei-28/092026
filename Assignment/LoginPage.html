<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="LoginPage.css">
<title>Login Page</title>
</head>

<body>
<main class="page-container">
<section class="login-card">
<h1>Log in to your account</h1>
<p class="subtitle">Enter your details below to continue.</p>

<form onsubmit="return validateForm()">
<div class="form-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
</div>

<div class="form-group">
<label for="password">Password</label>

<div class="password-container">
<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
<button type="button" class="show-password" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Show password">
<svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon">
<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
<circle cx="12" cy="12" r="3"/>
</svg>
</button>
</div>   

<div class="forgot-password">
<a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
</div>
</div>

<label class="remember-label">
<input type="checkbox" id="rememberMe" name="rememberMe">
Remember Username
</label>

<button class="login-button" type="submit">Log In</button>
</form>
</section>
</main>
<script src="LoginPage.js"></script>
</body>
</html>
