<!DOCTYPE html>
<html><head><title>Form - Text Input</title>
<link rel=icon href=sunflower.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<style>
table{
font-family: Times New Roman;
background-color: powderblue;
font-size: 16pt;
}
caption {
text-align:center;
font-weight: bold;
font-size: 20pt;
height:50px;
}
th, td {
padding: 15px;
height:20%;
}
td.title {
font-weight: bold;
font-size: large;
background-color: #687886;
color: #fff;
}
</style>

<script>
function validateForm(){
//to validate text-do not allow empty
let x= document.MyFirstForm.fname.value;
if(x == ""){
  alert("Please provide your First Name!");
  return false;
 }
//to validate text - only allow alphabet characters
let y = document.MyFirstForm.lname.value;
var letters = /^[0-9]/;
if(!y.match(letters))
{
  alert("Please input numeric only for Last Name.");
  return false;
 }
if((MyFirstForm.gender[0].checked == false) && (MyFirstForm.gender[1].checked == false))
 {
  alert("Please choose Gender: Male or Female");
  return false;
 }
var checkbox = document.getElementsByName("fav_sub");
var checked = false;

for (var i = 0; i < checkbox.length; i++) {
 if (checkbox[i].checked) {
  checked = true;
  break;
  }
 }

 if (checked == false) {
  alert("Please select at least one subject!");
  return false;
  }
}
</script>

</head>
<body topmargin=50>
<center>
<form name=MyFirstForm onsubmit="return validateForm()">  
<table>
<caption>Personal details:</caption>
<tr>
<td width='40%' class='title'>First Name: 
</td>
<td><input type=text name=fname size=50 maxlength=10></td>
</tr>
<tr>
<td class='title'>Last Name: </td>
<td><input type=text name=lname ></td>
</tr>
<tr>
<td class='title'>Gender: </td>
<td>
<input type = radio name = gender value = Male> Male
<input type = radio name = gender value = Female> Female
</td>
</tr>
<tr>
<td class='title'>
Choose your favorite subjects:</td>
<td>
<input type=checkbox name=fav_sub value=DCS4103>DCS4103
<input type=checkbox name=fav_sub value=DCS3003>DCS3003
<input type=checkbox name=fav_sub value=MST1003>MST1003
<input type=checkbox name=fav_sub value=MST2003>MST2003
</td>
</tr>
<tr><td class='title'>Address:</td>
<td><textarea rows=4 cols=30 name=address></textarea></td>
</tr>
<tr><td class='title'>Date of birth:</td>
<td><input type=date name=dob></td>
</tr>
<tr>
<td class='title'>Login password:</td>
<td><input type=password name=loginpass>
</td>
</tr>

<tr>
<td class='title'>Course:</td>
<td>
<select>
<option value="0">- List of Courses -</option>

<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma In Bussiness</option>
<option value="DAS">Diploma In Airline Services</option>
</select>
</td>
</tr>

</table>
<br><br>
<input type=submit value=Submit>
<input type=reset value=Reset>
</td></tr><br><br>
</form></center>
</body></html>
